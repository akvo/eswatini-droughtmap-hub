{% extends "admin/change_list.html" %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    /* Django's object-tool classes only ship an "add" (+) icon. These mirror
       its layout (icon right-aligned, 20px gutter) with download / upload
       arrows drawn inline so no static file is needed. */
    .object-tools a.downloadlink,
    .object-tools a.uploadlink {
      padding-right: 26px;
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px 12px;
    }
    .object-tools a.downloadlink {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M8 2v9'/><path d='M4 7l4 4 4-4'/><path d='M2 14h12'/></svg>");
    }
    .object-tools a.uploadlink {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M8 11V2'/><path d='M4 6l4-4 4 4'/><path d='M2 14h12'/></svg>");
    }
  </style>
{% endblock %}

{% block object-tools-items %}
  <li><a class="downloadlink" href="csv-template/">Download CSV template</a></li>
  <li><a class="uploadlink" href="import-csv/">Import station history CSV</a></li>
  {{ block.super }}
{% endblock %}
